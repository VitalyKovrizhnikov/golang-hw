openapi: 3.0.3
info:
  title: Calendar API
  description: REST API for the calendar service. User identity is passed in X-User-ID.
  version: 1.0.0
servers:
  - url: http://localhost:8080
paths:
  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List events for a user and optional period
      parameters:
        - $ref: '#/components/parameters/UserID'
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Events overlapping the requested period
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createEvent
      tags: [events]
      summary: Create an event
      parameters:
        - $ref: '#/components/parameters/UserID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventInput'
      responses:
        '201':
          description: Event created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /events/{id}:
    parameters:
      - $ref: '#/components/parameters/EventID'
    put:
      operationId: updateEvent
      tags: [events]
      summary: Replace an event
      parameters:
        - $ref: '#/components/parameters/UserID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventInput'
      responses:
        '200':
          description: Event updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: deleteEvent
      tags: [events]
      summary: Delete an event
      parameters:
        - $ref: '#/components/parameters/UserID'
      responses:
        '204':
          description: Event deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  parameters:
    UserID:
      name: X-User-ID
      in: header
      required: true
      description: Calendar owner identifier
      schema:
        type: string
        minLength: 1
    EventID:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    EventInput:
      type: object
      required: [title, startAt, endAt]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          nullable: true
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        notifyBefore:
          type: string
          nullable: true
          description: Go duration string, for example 15m or 24h
    Event:
      type: object
      required: [id, title, startAt, endAt, userId]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        userId:
          type: string
        notifyBefore:
          type: string
          nullable: true
          description: Go duration string, for example 15m or 24h
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Event not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Event already exists or the time slot is busy
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
